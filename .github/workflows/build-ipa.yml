name: build-ipa

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen || brew upgrade xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ hashFiles('Podfile') }}

      - name: Install pods (MobileVLCKit)
        run: |
          pod install --repo-update
          ls -d Pods/MobileVLCKit* || true

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace HikMon.xcworkspace \
            -scheme HikMon \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tail -n 80

      - name: Package unsigned IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/HikMon.app"
          if [ ! -d "$APP" ]; then
            echo "找不到构建产物：$APP"
            ls -R build/Build/Products || true
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry HikMon-unsigned.ipa Payload
          du -sh HikMon-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HikMon-unsigned-ipa
          path: HikMon-unsigned.ipa
          retention-days: 30
