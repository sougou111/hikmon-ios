name: HikMon

options:
  bundleIdPrefix: com.ynvr
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  xcodeVersion: "15.0"

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_BITCODE: NO
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    CLANG_CXX_LANGUAGE_STANDARD: "gnu++17"
    GCC_C_LANGUAGE_STANDARD: "gnu11"

targets:
  HikMon:
    type: application
    platform: iOS
    sources:
      - path: HikMon
        excludes:
          - "Resources/Info.plist"
          - "SDK/inc"
          - "SDK/lib"
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: AVFAudio.framework
      - sdk: AudioToolbox.framework
      - sdk: VideoToolbox.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: CoreGraphics.framework
      - sdk: QuartzCore.framework
      - sdk: OpenGLES.framework
      - sdk: GLKit.framework
      - sdk: CoreFoundation.framework
      - sdk: CFNetwork.framework
      - sdk: SystemConfiguration.framework
      - sdk: Security.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ynvr.hikmon
        INFOPLIST_FILE: HikMon/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: HikMon/SDK/HikMon-Bridging-Header.h
        GCC_PREPROCESSOR_DEFINITIONS:
          - "$(inherited)"
          - "HAS_HIKSDK=1"
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/HikMon/SDK/inc"
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/HikMon/SDK/lib"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lHCNetSDK"
          - "-lHCCore"
          - "-lsip"
          - "-lAudioEngine"
          - "-lopus"
          - "-lAIP"
          - "-laac"
          - "-laacld"
          - "-lssl"
          - "-lcrypto"
          - "-lNPQos"
          - "-lplayctrl"
          - "-lSystemTransform"
          - "-lz"
          - "-liconv"
          - "-lc++"
          - "-lbz2"

schemes:
  HikMon:
    build:
      targets:
        HikMon: all
    run:
      config: Debug
    archive:
      config: Release
